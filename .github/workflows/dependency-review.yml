name: Dependency review

# Looks at the dependencies a pull request adds or changes and fails if one has
# a known high severity vulnerability. Needs the "Dependency graph" setting on.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review changed dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
